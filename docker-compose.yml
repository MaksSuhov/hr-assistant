services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/hr_assistant.db
      STORAGE_DIR: /app/data/resumes
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - hr_data:/app/data
    depends_on:
      - qdrant

  web:
    build:
      context: apps/web
    ports:
      - "3000:80"
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  hr_data:
  qdrant_data:

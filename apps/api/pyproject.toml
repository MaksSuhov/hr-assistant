[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hr-assistant-backend"
version = "0.1.0"
description = "Backend for an HR assistant with hybrid RAG search and approval workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "email-validator>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.21,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=5.1,<7.0",
    "qdrant-client[fastembed]>=1.14,<2.0",
    "fastmcp>=2.14,<4.0",
    "langchain-core>=0.3,<2.0",
    "langchain-text-splitters>=0.3,<2.0",
    "openai>=1.68,<3.0",
    "httpx>=0.27,<1.0",
    "langfuse>=4.0,<6.0",
    "PyJWT[crypto]>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.11,<1.0",
    "mypy>=1.15,<2.0",
]

[project.scripts]
hr-eval = "eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_assistant", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["hr_assistant", "eval"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]

[tool.coverage.run]
source = ["hr_assistant", "eval"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "eval"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
